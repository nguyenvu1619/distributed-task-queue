version: "3.7"
services:
  postgres:
    image: postgres:16
    container_name: distributed_task_queue_postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=queue
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d queue"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: